# Copy to ops/alertmanager/secrets/alertmanager.yml and supply your SMTP details.
# Secrets stay in separate files; never put credentials in webhook URLs.
route:
  receiver: email
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: hank-inbox
      continue: true
    - receiver: email

receivers:
  - name: hank-inbox
    webhook_configs:
      - url: http://cloud:8080/v1/integrations/alertmanager
        send_resolved: true
        max_alerts: 0
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/hank-inbox-token
  - name: email
    email_configs:
      - to: administrator@example.invalid
        from: hank@example.invalid
        smarthost: smtp.example.invalid:587
        auth_username: hank@example.invalid
        auth_password_file: /etc/alertmanager/secrets/smtp-password
        require_tls: true
        send_resolved: true
